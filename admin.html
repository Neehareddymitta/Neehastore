<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>

<style>

body{
font-family:Arial;
padding:20px;
background:#f5f5f5;
}

input{
display:block;
margin:10px 0;
padding:8px;
width:300px;
}

button{
padding:10px;
background:#6b2d2d;
color:white;
border:none;
cursor:pointer;
}

.product{
background:white;
padding:10px;
margin:10px 0;
border-radius:5px;
}

img{
width:100px;
}

</style>

</head>

<body>

<h2>Admin Panel</h2>

<h3>Add Product</h3>

<input id="pname" placeholder="Product Name">

<input id="pprice" placeholder="Price">

<input type="file" id="pimage">

<button onclick="addProduct()">Add Product</button>

<hr>

<h3>Products</h3>

<div id="product-list"></div>

<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {
apiKey:"AIzaSyBHG-ugmBi7ILwpDr6VU1TQEAM6Fc8A9B8",
authDomain:"neehastore.firebaseapp.com",
projectId:"neehastore",
storageBucket:"neehastore.appspot.com",
messagingSenderId:"759495137938",
appId:"1:759495137938:web:92409c0a561eebe543644b"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

function addProduct(){

let name=document.getElementById("pname").value;
let price=document.getElementById("pprice").value;
let file=document.getElementById("pimage").files[0];

if(!name || !price || !file){
alert("Fill all fields");
return;
}

let reader=new FileReader();

reader.onload=function(e){

db.collection("products").add({

name:name,
price:Number(price),
image:e.target.result

}).then(()=>{

alert("Product Added");

displayProducts();

});

};

reader.readAsDataURL(file);

}

function deleteProduct(id){

db.collection("products").doc(id).delete().then(()=>{

displayProducts();

});

}

function displayProducts(){

let container=document.getElementById("product-list");

container.innerHTML="";

db.collection("products").get().then(snapshot=>{

snapshot.forEach(doc=>{

let p=doc.data();

container.innerHTML+=`

<div class="product">

<img src="${p.image}">

<h4>${p.name}</h4>

<p>₹${p.price}</p>

<button onclick="deleteProduct('${doc.id}')">
Delete
</button>

</div>

`;

});

});

}

displayProducts();

</script>

</body>
</html>
