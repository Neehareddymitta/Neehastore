<!DOCTYPE html>
<html>
<head>

<title>Admin Panel - Neeha Store</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
margin:0;
}

header{
background:#6b2d2d;
color:white;
padding:15px;
}

.container{
padding:30px;
}

.box{
background:white;
padding:20px;
border-radius:10px;
margin-bottom:30px;
}

input{
width:100%;
padding:8px;
margin:5px 0;
}

button{
background:#6b2d2d;
color:white;
border:none;
padding:8px;
cursor:pointer;
margin:5px 0;
}

.product{
border-bottom:1px solid #ddd;
padding:10px 0;
}

.order{
border-bottom:1px solid #ddd;
padding:10px 0;
}

</style>

</head>

<body>

<header>
<h2>Neeha Store Admin Panel</h2>
</header>

<div class="container">

<!-- ADD PRODUCT -->

<div class="box">

<h3>Add Product</h3>

<input id="pname" placeholder="Product Name">

<input id="pprice" placeholder="Price">

<input id="pimage" placeholder="Image URL">

<button onclick="addProduct()">Add Product</button>

</div>


<!-- PRODUCT LIST -->

<div class="box">

<h3>Manage Products</h3>

<div id="productList"></div>

</div>


<!-- ORDERS -->

<div class="box">

<h3>Customer Orders</h3>

<div id="orderList"></div>

</div>

</div>

<script>

let products = JSON.parse(localStorage.getItem("products")) || [];

let orders = JSON.parse(localStorage.getItem("orders")) || [];


// ADD PRODUCT

function addProduct(){

let name=document.getElementById("pname").value;
let price=document.getElementById("pprice").value;
let image=document.getElementById("pimage").value;

products.push({
name:name,
price:Number(price),
image:image,
stock:true
});

localStorage.setItem("products",JSON.stringify(products));

alert("Product added");

location.reload();

}


// DISPLAY PRODUCTS

function loadProducts(){

let container=document.getElementById("productList");

container.innerHTML="";

products.forEach((p,i)=>{

container.innerHTML+=`

<div class="product">

<img src="${p.image}" width="80">

<p>${p.name}</p>

<p>₹${p.price}</p>

<p>Status: ${p.stock ? "Available":"Out of Stock"}</p>

<button onclick="toggleStock(${i})">

${p.stock ? "Set Out of Stock":"Set Available"}

</button>

<button onclick="deleteProduct(${i})">Delete</button>

</div>

`;

});

}


// OUT OF STOCK

function toggleStock(i){

products[i].stock=!products[i].stock;

localStorage.setItem("products",JSON.stringify(products));

loadProducts();

}


// DELETE PRODUCT

function deleteProduct(i){

products.splice(i,1);

localStorage.setItem("products",JSON.stringify(products));

loadProducts();

}


// LOAD ORDERS

function loadOrders(){

let container=document.getElementById("orderList");

container.innerHTML="";

if(orders.length===0){

container.innerHTML="No orders yet";

return;

}

orders.forEach((o,i)=>{

container.innerHTML+=`

<div class="order">

<p><b>Customer:</b> ${o.name}</p>

<p><b>Phone:</b> ${o.phone}</p>

<p><b>Email:</b> ${o.email}</p>

<p><b>Amount:</b> ₹${o.amount}</p>

<p><b>Date:</b> ${o.date}</p>

<p>

Status:

<select onchange="updateStatus(${i},this.value)">

<option ${o.status=="Pending"?"selected":""}>Pending</option>

<option ${o.status=="Shipped"?"selected":""}>Shipped</option>

<option ${o.status=="Delivered"?"selected":""}>Delivered</option>

</select>

</p>

</div>

`;

});

}


// UPDATE ORDER STATUS

function updateStatus(i,status){

orders[i].status=status;

localStorage.setItem("orders",JSON.stringify(orders));

alert("Order status updated");

}


loadProducts();

loadOrders();

</script>

</body>
</html>
