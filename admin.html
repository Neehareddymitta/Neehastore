<!DOCTYPE html>
<html>
<head>

<title>Neeha Store Admin</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
margin:0;
}

header{
background:#6b2d2d;
color:white;
padding:15px;
}

.container{
padding:30px;
}

.box{
background:white;
padding:20px;
border-radius:10px;
margin-bottom:30px;
}

input{
width:100%;
padding:8px;
margin:5px 0;
}

button{
background:#6b2d2d;
color:white;
border:none;
padding:8px;
cursor:pointer;
margin:5px 0;
}

.product{
border-bottom:1px solid #ddd;
padding:10px 0;
}

</style>

</head>

<body>

<script>
let pass = prompt("Enter Admin Password");

if(pass !== "neehaadmin123"){
alert("Access Denied");
window.location.href="index.html";
}
</script>

<header>
<h2>Neeha Store Admin Panel</h2>
</header>

<div class="container">

<div class="box">

<h3>Add Product</h3>

<input id="pname" placeholder="Product Name">

<input id="pprice" placeholder="Price">

<input type="file" id="pimage">

<button onclick="addProduct()">Add Product</button>

</div>

<div class="box">

<h3>Manage Products</h3>

<div id="productList"></div>

</div>

</div>

<script>

let products = JSON.parse(localStorage.getItem("products")) || [];

function addProduct(){

let name=document.getElementById("pname").value;
let price=document.getElementById("pprice").value;
let file=document.getElementById("pimage").files[0];

let reader=new FileReader();

reader.onload=function(e){

db.collection("products").add({

name:name,
price:Number(price),
image:e.target.result

}).then(()=>{

alert("Product Added");

});

};

reader.readAsDataURL(file);

}
function loadProducts(){

let container=document.getElementById("productList");

container.innerHTML="";

products.forEach((p,i)=>{

container.innerHTML+=`

<div class="product">

<img src="${p.image}" width="100">

<p>${p.name}</p>

<p>₹${p.price}</p>

<p>Status: ${p.stock ? "Available":"Out of Stock"}</p>

<button onclick="toggleStock(${i})">
${p.stock ? "Set Out of Stock":"Set Available"}
</button>

<button onclick="deleteProduct(${i})">
Delete
</button>

</div>

`;

});

}

function toggleStock(i){

products[i].stock=!products[i].stock;

localStorage.setItem("products",JSON.stringify(products));

loadProducts();

}

function deleteProduct(i){

products.splice(i,1);

localStorage.setItem("products",JSON.stringify(products));

loadProducts();

}

loadProducts();

</script>

</body>
</html>
