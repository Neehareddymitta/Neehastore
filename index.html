<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neeha Store</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f5f5f5;
}

header{
background:#6b2d2d;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
padding:20px;
}

.product{
background:white;
padding:10px;
border-radius:10px;
text-align:center;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.product img{
width:100%;
border-radius:10px;
}

button{
background:#6b2d2d;
color:white;
border:none;
padding:8px;
border-radius:5px;
cursor:pointer;
}

.cart{
position:fixed;
right:-350px;
top:0;
width:320px;
height:100%;
background:white;
padding:20px;
box-shadow:-3px 0 10px rgba(0,0,0,0.2);
overflow:auto;
transition:0.3s;
}

.cart.open{
right:0;
}

input{
width:100%;
padding:8px;
margin:5px 0;
}

</style>

</head>

<body>

<header>

<h2>Neeha Store</h2>

<button onclick="toggleCart()">
Cart (<span id="cart-count">0</span>)
</button>

</header>

<div class="products" id="product-list"></div>

<div class="cart" id="cart">

<button onclick="toggleCart()">Close</button>

<h3>Your Cart</h3>

<div id="cart-items"></div>

<h4 id="total"></h4>

</div>

<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {
apiKey:"AIzaSyBHG-ugmBi7ILwpDr6VU1TQEAM6Fc8A9B8",
authDomain:"neehastore.firebaseapp.com",
projectId:"neehastore",
storageBucket:"neehastore.appspot.com",
messagingSenderId:"759495137938",
appId:"1:759495137938:web:92409c0a561eebe543644b"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

let cart=[];

function displayProducts(){

let container=document.getElementById("product-list");

container.innerHTML="";

db.collection("products").get().then(snapshot=>{

snapshot.forEach(doc=>{

let p=doc.data();

container.innerHTML+=`

<div class="product">

<img src="${p.image}">

<h4>${p.name}</h4>

<p>₹${p.price}</p>

<button onclick="addToCart('${p.name}',${p.price})">
Add to Cart
</button>

</div>

`;

});

});

}

function addToCart(name,price){

cart.push({name,price});

updateCart();

alert("Added to cart");

}

function updateCart(){

let cartItems=document.getElementById("cart-items");

let total=0;

cartItems.innerHTML="";

cart.forEach(item=>{

total+=item.price;

cartItems.innerHTML+=`
<div>${item.name} - ₹${item.price}</div>
`;

});

document.getElementById("cart-count").innerText=cart.length;

document.getElementById("total").innerText="Total: ₹"+total;

}

function toggleCart(){

document.getElementById("cart").classList.toggle("open");

}

displayProducts();

</script>

</body>
</html>
