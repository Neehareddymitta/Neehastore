<!DOCTYPE html>
<html>
<head>
<title>Neeha Store Account</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

<style>

body{
font-family:Arial;
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
display:flex;
gap:40px;
}

.box{
background:white;
padding:25px;
border-radius:10px;
width:280px;
text-align:center;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

input{
width:90%;
padding:10px;
margin:8px 0;
}

button{
background:#6b2d2d;
color:white;
border:none;
padding:10px;
cursor:pointer;
width:95%;
}

</style>

</head>

<body>

<div class="container">

<!-- SIGNUP -->

<div class="box">

<h2>Create Account</h2>

<input type="email" id="signupEmail" placeholder="Email">

<input type="text" id="signupPhone" placeholder="Phone Number">

<input type="password" id="signupPassword" placeholder="Create Password">

<input type="password" id="signupPassword2" placeholder="Confirm Password">

<button onclick="signup()">Sign Up</button>

<p id="signupMsg"></p>

</div>


<!-- LOGIN -->

<div class="box">

<h2>Login</h2>

<input type="email" id="loginEmail" placeholder="Email">

<input type="password" id="loginPassword" placeholder="Password">

<button onclick="login()">Login</button>

<p id="loginMsg"></p>

</div>

</div>


<script>

const firebaseConfig = {
apiKey: "PASTE_API_KEY",
authDomain: "PASTE_AUTH_DOMAIN",
projectId: "PASTE_PROJECT_ID",
appId: "PASTE_APP_ID"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();


// SIGNUP

function signup(){

let email=document.getElementById("signupEmail").value;
let phone=document.getElementById("signupPhone").value;
let password=document.getElementById("signupPassword").value;
let password2=document.getElementById("signupPassword2").value;

if(password!==password2){

document.getElementById("signupMsg").innerText="Passwords do not match";
return;

}

auth.createUserWithEmailAndPassword(email,password)

.then((userCredential)=>{

let user=userCredential.user;

user.sendEmailVerification()

.then(()=>{

localStorage.setItem("userPhone",phone);

document.getElementById("signupMsg").innerText="Account created. Check your email for verification.";

setTimeout(()=>{
window.location.href="index.html";
},2000);

});

})

.catch((error)=>{
document.getElementById("signupMsg").innerText=error.message;
});

}



// LOGIN

function login(){

let email=document.getElementById("loginEmail").value;
let password=document.getElementById("loginPassword").value;

auth.signInWithEmailAndPassword(email,password)

.then(()=>{

localStorage.setItem("userLoggedIn","true");

document.getElementById("loginMsg").innerText="Login successful";

setTimeout(()=>{
window.location.href="index.html";
},1500);

})

.catch((error)=>{
document.getElementById("loginMsg").innerText=error.message;
});

}

</script>

</body>
</html>
