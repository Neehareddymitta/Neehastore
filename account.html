<!DOCTYPE html>
<html>
<head>
<title>Neeha Store Account</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

<style>

body{
font-family:Arial;
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:white;
padding:30px;
border-radius:10px;
width:300px;
text-align:center;
}

input{
width:90%;
padding:10px;
margin:10px 0;
}

button{
padding:10px 15px;
background:#6b2d2d;
color:white;
border:none;
margin:5px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="box">

<h2>Neeha Store Account</h2>

<input type="email" id="email" placeholder="Email">

<input type="password" id="password" placeholder="Password">

<button onclick="signup()">Sign Up</button>

<button onclick="login()">Login</button>

<button onclick="logout()">Logout</button>

<p id="status"></p>

<a href="index.html">Back to Store</a>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyBHG-ugmBi7ILwpDr6VU1TQEAM6Fc8A9B8",
  authDomain: "neehastore-8c8bc.firebaseapp.com",
  projectId: "neehastore-8c8bc",
  storageBucket: "neehastore-8c8bc.firebasestorage.app",
  messagingSenderId: "759495137938",
  appId: "1:759495137938:web:92409c0a561eebe543644b",
  measurementId: "G-LH1199WZBX"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

function signup(){

let email=document.getElementById("email").value;
let password=document.getElementById("password").value;

auth.createUserWithEmailAndPassword(email,password)
.then(()=>{

localStorage.setItem("userLoggedIn","true");

document.getElementById("status").innerText="Account created successfully";

})
.catch(err=>{
document.getElementById("status").innerText=err.message;
});

}

function login(){

let email=document.getElementById("email").value;
let password=document.getElementById("password").value;

auth.signInWithEmailAndPassword(email,password)
.then(()=>{

localStorage.setItem("userLoggedIn","true");

document.getElementById("status").innerText="Login successful";

})
.catch(err=>{
document.getElementById("status").innerText=err.message;
});

}

function logout(){

auth.signOut();

localStorage.removeItem("userLoggedIn");

document.getElementById("status").innerText="Logged out";

}

</script>

</body>
</html>
